    }

      text-decoration: none;
      color: #7a7a7a;
      font-weight: 700;

      letter-spacing: 0.8px;
      text-transform: uppercase;
      padding-bottom: 4px;

    }

    .video-grid {
      display: grid;

      gap: 24px;
    }

    .video-container {
      position: relative;
      padding-bottom: 56.25%;
      border-radius: 12px;
      overflow: hidden;
    }

    .video-container iframe {
      position: absolute;
      width: 100%;
      height: 100%;
      border: none;
    }

    @media (max-width: 768px) {
      .header-inner {
        flex-direction: column;
        align-items: flex-start;
        gap: 16px;
      }

      .video-grid {
        grid-template-columns: 1fr;

      .card {
