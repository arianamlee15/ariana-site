<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <title>School Projects | Ariana Lee</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- FAVICON -->
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", Arial, Helvetica, sans-serif;
      color: #2e2e2e;

      background-color: #f8f4ff;
      background-image:
        radial-gradient(
          circle at 10% 15%,
          rgba(199, 177, 255, 0.75) 0,
          transparent 30%
        ),
        radial-gradient(
          circle at 90% 15%,
          rgba(255, 194, 223, 0.65) 0,
          transparent 30%
        ),
        radial-gradient(
          circle at 10% 90%,
          rgba(169, 220, 255, 0.65) 0,
          transparent 32%
        ),
        radial-gradient(
          circle at 90% 85%,
          rgba(223, 180, 255, 0.55) 0,
          transparent 30%
        ),
        linear-gradient(
          135deg,
          #faf6ff 0%,
          #fff5fa 50%,
          #f3f8ff 100%
        );

      background-attachment: fixed;
      background-repeat: no-repeat;
      background-size: cover;
    }

    /* HEADER */
    .site-header {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(0, 0, 0, 0.08);
    }

    .header-inner {
      max-width: 1200px;
      margin: 0 auto;
      padding: 22px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .brand {
      text-decoration: none;
      color: #6b5ca8;
      font-weight: 700;
      letter-spacing: 1.5px;
      font-size: 22px;
      text-transform: uppercase;
    }

    .nav {
      display: flex;
      gap: 28px;
      flex-wrap: wrap;
    }

    .nav a {
      text-decoration: none;
      color: #7a7a7a;
      font-weight: 700;
      font-size: 14px;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      padding-bottom: 4px;
      border-bottom: 2px solid transparent;
    }

    .nav a:hover {
      color: #6b5ca8;
      border-bottom-color: #bfaeff;
    }

    .nav a.active {
      color: #4b3c82;
      border-bottom-color: #6b5ca8;
    }

    main {
      max-width: 1000px;
      margin: 0 auto;
      padding: 64px 32px;
    }

    .card {
      background: rgba(255, 255, 255, 0.84);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.75);
      border-radius: 20px;
      padding: 48px;

      box-shadow:
        0 24px 50px rgba(107, 92, 168, 0.18),
        0 4px 12px rgba(0, 0, 0, 0.06);
    }

    h1 {
      margin: 0 0 12px;
      font-size: 32px;
      color: #4b3c82;
    }

    .intro {
      font-size: 16px;
      line-height: 1.6;
      max-width: 760px;
      margin: 0 0 32px;
    }

    /* ACCORDION */
    .accordion-item {
      margin-bottom: 18px;
      border: 1px solid rgba(107, 92, 168, 0.18);
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.72);
      overflow: hidden;
    }

    .accordion-header {
      width: 100%;
      border: none;
      background: transparent;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      font-family: inherit;
      font-size: 20px;
      font-weight: 700;
      color: #5a4bb0;
      padding: 18px 20px;
      text-align: left;
    }

    .accordion-header:hover {
      background: rgba(191, 174, 255, 0.12);
      color: #4b3c82;
    }

    .plus {
      font-size: 28px;
      font-weight: 700;
      line-height: 1;
      transition: transform 0.25s ease;
    }

    .accordion-content {
      display: none;
      padding: 0 18px 18px;
    }

    .accordion-item.active .accordion-content {
      display: block;
    }

    .accordion-item.active .plus {
      transform: rotate(45deg);
    }

    .accordion-content iframe {
      display: block;
      width: 100%;
      height: 700px;
      border: none;
      border-radius: 12px;
      background: white;

      box-shadow:
        0 10px 25px rgba(0, 0, 0, 0.10);
    }

    @media (max-width: 768px) {
      .header-inner {
        flex-direction: column;
        align-items: flex-start;
      }

      .nav {
        gap: 16px;
      }

      main {
        padding: 36px 18px;
      }

      .card {
        padding: 30px 20px;
      }

      h1 {
        font-size: 29px;
      }

      .accordion-header {
        font-size: 17px;
        padding: 16px;
      }

      .accordion-content {
        padding: 0 12px 12px;
      }

      .accordion-content iframe {
        height: 500px;
      }
    }
  </style>
</head>

<body>

  <header class="site-header">
    <div class="header-inner">

      <a href="index.html" class="brand">Ariana Lee</a>

      <nav class="nav">
        <a href="about.html">About</a>
        <a class="active" href="school-projects.html">School</a>
        <a href="sports.html">Sports</a>
        <a href="piano.html">Piano</a>
        <a href="hobbies.html">Hobbies</a>
        <a href="book-list.html">Book List</a>
        <a href="harvey.html">Harvey</a>
      </nav>

    </div>
  </header>

  <main>
    <div class="card">

      <h1>School Projects</h1>

      <p class="intro">
        This page showcases the school projects I have worked on throughout the
        year. Each project reflects what I am learning in class and how I apply
        my skills in different subjects.
      </p>

      <!-- PROJECT 1 -->
      <div class="accordion-item">

        <button
          class="accordion-header"
          type="button"
          aria-expanded="false"
        >
          <span>How Issac Newton Somewhat Ruined My Week</span>
          <span class="plus">+</span>
        </button>

        <div class="accordion-content">
          <iframe
            src="files/how-issac-newton.pdf"
            title="How Issac Newton Somewhat Ruined My Week"
            loading="lazy">
          </iframe>
        </div>

      </div>

      <!-- PROJECT 2 -->
      <div class="accordion-item">

        <button
          class="accordion-header"
          type="button"
          aria-expanded="false"
        >
          <span>Costa Rica Project</span>
          <span class="plus">+</span>
        </button>

        <div class="accordion-content">
          <iframe
            src="files/costa-rica.pdf"
            title="Costa Rica Project"
            loading="lazy">
          </iframe>
        </div>

      </div>

      <!-- PROJECT 3 -->
      <div class="accordion-item">

        <button
          class="accordion-header"
          type="button"
          aria-expanded="false"
        >
          <span>Barrier Breakers</span>
          <span class="plus">+</span>
        </button>

        <div class="accordion-content">
          <iframe
            src="files/Barrier%20Breakers.pdf"
            title="Barrier Breakers"
            loading="lazy">
          </iframe>
        </div>

      </div>

    </div>
  </main>

  <script>
    const accordionItems = document.querySelectorAll(".accordion-item");

    accordionItems.forEach((item) => {
      const header = item.querySelector(".accordion-header");

      header.addEventListener("click", () => {
        const wasAlreadyOpen = item.classList.contains("active");

        // Close every project
        accordionItems.forEach((otherItem) => {
          otherItem.classList.remove("active");

          const otherHeader =
            otherItem.querySelector(".accordion-header");

          otherHeader.setAttribute("aria-expanded", "false");
        });

        // Open only the project that was clicked
        if (!wasAlreadyOpen) {
          item.classList.add("active");
          header.setAttribute("aria-expanded", "true");
        }
      });
    });
  </script>

</body>
</html>
