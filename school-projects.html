      background:

    .nav a.active { color: #4b3c82; border-bottom-color: #6b5ca8; }

    main { max-width: 1000px; margin: 0 auto; padding: 64px 32px; }
    .card {
      background: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(6px);
      border-radius: 18px;
      padding: 48px;

    p { font-size: 16px; line-height: 1.6; max-width: 760px; margin: 0 0 14px; }
