<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>In Memory of Harvey | Ariana Lee</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: "Segoe UI", Arial, Helvetica, sans-serif;
      color: #2e2e2e;
      background:
        radial-gradient(circle at top left, rgba(190,160,255,0.2), white 50%),
        radial-gradient(circle at bottom right, rgba(160,120,255,0.2), white 50%);
    }

    .site-header {
      position: sticky;
      top: 0;
      background: rgba(255,255,255,0.9);
      backdrop-filter: blur(8px);
    }

    .header-inner {
      max-width: 1200px;
      margin: auto;
      padding: 22px 32px;
      display: flex;
      justify-content: space-between;
    }

    .brand {
      text-decoration: none;
      color: #6b5ca8;
      font-weight: 700;
    }

    .nav {
      display: flex;
      gap: 28px;
    }

    .nav a {
      text-decoration: none;
      color: #7a7a7a;
      font-weight: 700;
    }

    .nav a.active {
      color: #4b3c82;
      border-bottom: 2px solid #6b5ca8;
    }

    main {
      max-width: 900px;
      margin: auto;
      padding: 64px 24px;
    }

    h1 {
      text-align: center;
      color: #4b3c82;
      margin-bottom: 10px;
    }

    .subtitle {
      text-align: center;
      color: #888;
      margin-bottom: 40px;
      font-style: italic;
    }

    /* SIDE-BY-SIDE PROFILE */
    .profile-row {
      display: flex;
      gap: 30px;
      align-items: center;
      margin-bottom: 40px;
    }

    .photo-section img {
      width: 240px;
      border-radius: 16px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.15);
    }

    .profile-card {
      flex: 1;
      background: white;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
    }

    .profile-title {
      font-weight: 700;
      color: #5a4bb0;
      margin-bottom: 10px;
    }

    p {
      line-height: 1.6;
      margin-bottom: 10px;
    }

    /* VIDEO SECTION */
    .section-title {
      margin-top: 30px;
      margin-bottom: 15px;
      color: #5a4bb0;
      font-weight: 700;
      text-align: center;
    }

    .video-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
    }

    .video-container {
      position: relative;
      width: 100%;
      padding-bottom: 56.25%;
    }

    .video-container iframe {
      position: absolute;
      width: 100%;
      height: 100%;
      border: none;
      border-radius: 12px;
    }

    /* MOBILE */
    @media (max-width: 768px) {
      .profile-row {
        flex-direction: column;
        text-align: center;
      }

      .video-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

      <a class="active" href="harvey.html">Harvey</a>
    </nav>
  </div>

</div>

</main>

</body>
</html>
