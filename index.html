<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Ariana Lee</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: "Segoe UI", Arial, Helvetica, sans-serif;
      color: #2e2e2e;
      background:
        radial-gradient(circle at top left, rgba(190, 160, 255, 0.35), rgba(255, 255, 255, 0.9) 45%),
        radial-gradient(circle at bottom right, rgba(160, 120, 255, 0.35), rgba(255, 255, 255, 0.9) 50%);
      min-height: 100vh;
    }

    .site-header {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid rgba(0, 0, 0, 0.08);
    }

    .header-inner {
      max-width: 1200px;
      margin: 0 auto;
      padding: 22px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      text-decoration: none;
      color: #6b5ca8;
      font-weight: 700;
      letter-spacing: 1.5px;
      font-size: 22px;
      text-transform: uppercase;
    }

    .nav {
      display: flex;
      gap: 32px;
      flex-wrap: wrap;
    }

    .nav a {
      text-decoration: none;
      color: #7a7a7a;
      font-weight: 700;
      font-size: 14px;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      padding-bottom: 4px;
      border-bottom: 2px solid transparent;
    }

    .nav a:hover {
      color: #6b5ca8;
      border-bottom-color: #bfaeff;
    }

    main {
      max-width: 1000px;
      margin: 0 auto;
      padding: 64px 32px;
    }

    .hero {
      background: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(6px);
      border-radius: 18px;
      padding: 56px;
      box-shadow:
        0 20px 40px rgba(120, 90, 200, 0.15),
        0 2px 6px rgba(0, 0, 0, 0.05);
    }

    h1 {
      margin: 0 0 12px;
      font-size: 34px;
      color: #4b3c82;
    }

    p {
      font-size: 16px;
      line-height: 1.6;
      max-width: 760px;
      margin: 0 0 14px;
    }

    .cta-row {
      margin-top: 24px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    .btn {
      display: inline-block;
      text-decoration: none;
      background: rgba(107, 92, 168, 0.12);
      color: #4b3c82;
      border: 1px solid rgba(107, 92, 168, 0.25);
      padding: 10px 14px;
      border-radius: 12px;
      font-weight: 700;
      letter-spacing: 0.2px;
    }

    .btn:hover {
      background: rgba(107, 92, 168, 0.18);
    }

    @media (max-width: 768px) {
      .header-inner {
        flex-direction: column;
        align-items: flex-start;
        gap: 16px;
      }

      .hero {
        padding: 32px;
      }
    }
  </style>
</head>

<body>
  <header class="site-header">
    <div class="header-inner">
      <a href="index.html" class="brand">Ariana Lee</a>
      <nav class="nav">
        <a href="about.html">About</a>
        <a href="school-projects.html">School Projects</a>
        <a href="sports.html">Sports</a>
        <a href="hobbies.html">Hobbies</a>
      </nav>
    </div>
  </header>

  <main>
    <div class="hero">
      <h1>Welcome</h1>
      <p>
        This is my website. Use the menu at the top to visit each section.
      </p>
      <p>
        I share my school projects, sports, and hobbies here.
      </p>

      <div class="cta-row">
        <a class="btn" href="about.html">Go to About</a>
        <a class="btn" href="school-projects.html">Go to School Projects</a>
        <a class="btn" href="sports.html">Go to Sports</a>
        <a class="btn" href="hobbies.html">Go to Hobbies</a>
      </div>
    </div>
  </main>
</body>
</html>
